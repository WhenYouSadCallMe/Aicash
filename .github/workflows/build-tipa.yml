name: build-tipa

# 在 GitHub 的 macOS runner 上编译 + 签名 + 打包 .tipa，并跑完一致性校验。
# 触发：手动（Actions → build-tipa → Run workflow）或 push 到 main/master。

on:
  workflow_dispatch:
    inputs:
      bundled_kernel:
        description: "是否内置 codex 内核（false = 瘦身包，内核由 App 内运行时下载器按需下载）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [ main, master ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 默认瘦身：不内置内核（App 首次启动时经 CARuntimeManifestURL 下载）。
      # 仅当手动触发且 bundled_kernel=true 时才拉取内核 artifact。
      - name: 拉取内核 artifact（可选）
        id: fetch_kernel
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bundled_kernel == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('Kernel/dist/codex')) {
              core.info('仓库内已有内核，跳过');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-kernel-ios.yml',
              status: 'success',
              per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            if (!run) { core.warning('没有成功的内核构建，产物不含智能内核'); return; }
            core.info(`从 run ${run.id} 下载内核 artifact`);
            const arts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const art = arts.data.artifacts.find(a => a.name === 'codex-ios-arm64');
            if (!art) { core.warning(`run ${run.id} 没有 codex-ios-arm64 artifact`); return; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip',
            });
            fs.mkdirSync('Kernel/dist', { recursive: true });
            fs.writeFileSync('/tmp/kernel.zip', Buffer.from(dl.data));
            await exec.exec('unzip', ['-o', '/tmp/kernel.zip', '-d', '/tmp/kernel_art']);
            fs.copyFileSync('/tmp/kernel_art/codex', 'Kernel/dist/codex');
            try { fs.copyFileSync('/tmp/kernel_art/codex.sha256', 'Kernel/dist/codex.sha256'); } catch (e) {}
            fs.chmodSync('Kernel/dist/codex', 0o755);
            await exec.exec('ls', ['-l', 'Kernel/dist']);

      - name: 工具链信息
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          python3 --version
          which make clang ldid || true

      - name: 安装 ldid（失败则回退 codesign adhoc）
        run: |
          brew install ldid || echo "::warning::ldid 安装失败，将回退 codesign --sign -"

      - name: 编译（CodexApp + ca-filetool + MTShareExtension 并装配 bundle）
        run: |
          set -o pipefail
          make -C build all 2>&1 | tee build_all.log

      - name: 失败时导出编译日志
        if: failure()
        run: |
          echo "==== 编译失败，日志尾部 ===="
          echo "==== 首个编译/链接错误 ===="
          grep -n -E 'error:|fatal error|clang:|undefined symbols|duplicate symbol|ld:' build_all.log | head -n 100 || true
          echo "==== 完整日志尾部（最近 500 行） ===="
          tail -n 500 build_all.log || true
          exit 1

      - name: 签名（entitlements 逐项对齐原包）
        run: |
          make -C build sign 2>&1 | tee build_sign.log || echo "::warning::签名步骤有警告，见 build_sign.log"

      - name: 打包 .tipa（条目顺序/权限/符号链接与原包一致）
        run: |
          make -C build package 2>&1 | tee build_package.log

      - name: 校验（工程一致性 + 产物一致性）
        run: |
          python3 - <<'PY'
          import subprocess, sys
          checks = [
              ["python3", "verify/verify_parity.py"],
              ["python3", "verify/verify_literals.py"],
              ["python3", "scripts/check_sources.py"],
              ["python3", "scripts/check_conflicts.py"],
              ["python3", "scripts/check_screenshot_literals.py"],
              ["python3", "scripts/fix_parity_forward_decls.py", "--check"],
              ["python3", "scripts/run_all_checks.py"],
              ["python3", "verify/verify_package.py", "--replica", "build/MT-Agent-replica.tipa"],
          ]
          failed = []
          for cmd in checks:
              print("\n$ " + " ".join(cmd), flush=True)
              rc = subprocess.run(cmd).returncode
              if rc != 0:
                  failed.append(" ".join(cmd))
          print("\n失败项:", failed or "无")
          sys.exit(1 if failed else 0)
          PY

      - name: 收集产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT-Agent-replica-${{ github.run_number }}
          path: |
            build/MT-Agent-replica.tipa
            build/out/Payload/CodexApp.app/**
            build_*.log
            SPEC/*.json
          if-no-files-found: warn
          retention-days: 30

      # 把编译好的 .tipa 回传到 dist 分支（单提交孤分支，force push，不膨胀历史），
      # 这样在没有 gh/token 的环境里也能用 git 直接取回二进制。
      - name: 回传 .tipa 到 dist 分支
        if: always()
        continue-on-error: true
        run: |
          set -x
          TIPA=build/MT-Agent-replica.tipa
          if [ ! -f "$TIPA" ]; then echo "没有产物，跳过"; exit 0; fi
          mkdir -p dist && cp "$TIPA" dist/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tipa 含 248MB 内核，超 GitHub 100MB 常规文件上限 → 走 Git LFS
          git lfs install --local || true
          git lfs track "dist/MT-Agent-replica.tipa" || true
          git checkout --orphan dist-publish
          git reset
          git add -f .gitattributes dist/MT-Agent-replica.tipa
          git commit -m "tipa run #${{ github.run_number }} sha=${{ github.sha }} size=$(stat -f%z dist/MT-Agent-replica.tipa)"
          git push -f origin dist-publish:dist

      - name: 摘要
        if: always()
        run: |
          {
            echo "## MT Agent 复刻构建结果"
            echo ""
            echo "- 运行: #${{ github.run_number }} (${{ github.sha }})"
            [ -f build/MT-Agent-replica.tipa ] && echo "- 产物: build/MT-Agent-replica.tipa ($(stat -f%z build/MT-Agent-replica.tipa) 字节)" || echo "- 产物: 未生成"
            [ -f build/out/Payload/CodexApp.app/CodexApp ] && echo "- 主程序: $(file -b build/out/Payload/CodexApp.app/CodexApp)" || true
            echo "- 装配清单条目: $(grep -c '\"path\"' build/bundle_manifest.json 2>/dev/null || echo n/a)"
            echo ""
            echo "### 编译警告/错误摘录（如有）"
            echo '```'
            grep -E \"error:|warning:\" build_all.log 2>/dev/null | head -n 40 || echo "无"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
