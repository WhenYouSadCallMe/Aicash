name: build-kernel-ios

# 编译 openai/codex 内核到 aarch64-apple-ios（iOS arm64）。
# 产物: artifact codex-ios-arm64（含 codex 可执行文件 + sha256），并回传到 dist 分支 Kernel/dist/。
# 触发: 手动（Actions → build-kernel-ios → Run workflow，填 codex_ref）或 Kernel/** 变更。

on:
  workflow_dispatch:
    inputs:
      codex_ref:
        description: "openai/codex 的 tag 或 commit"
        required: true
        default: "rust-v0.162.1"
      profile:
        description: "cargo profile"
        required: true
        default: "release"
        type: choice
        options: ["release", "dev"]
  push:
    paths:
      - "Kernel/**"
      - ".github/workflows/build-kernel-ios.yml"

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-ios
  RUST_BACKTRACE: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          uname -a

      - name: 安装 Rust
        run: |
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: 安装 ldid
        run: |
          brew install ldid || \
          (git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid && \
           cd /tmp/ldid && make -j4 && sudo cp ldid /usr/local/bin/ldid)

      - name: 克隆 openai/codex
        run: |
          git clone --filter=blob:none https://github.com/openai/codex.git upstream
          cd upstream
          git checkout "${{ github.event.inputs.codex_ref || 'rust-v0.162.1' }}"
          git log -1 --format="%H %s"
          # Rust 工作区位于 codex-rs/ 子目录（老版本布局），新版本在仓库根
          if [ -f codex-rs/Cargo.toml ]; then echo "CODEX_RS_DIR=codex-rs" >> "$GITHUB_ENV"
          elif [ -f Cargo.toml ]; then echo "CODEX_RS_DIR=." >> "$GITHUB_ENV"
          else echo "CODEX_RS_DIR=codex-rs" >> "$GITHUB_ENV"; fi
          echo "workspace dir: $CODEX_RS_DIR"

      - name: 应用 iOS 补丁
        run: |
          set -e
          cd upstream
          for p in ../Kernel/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "applying $p"
            git apply --index "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done
          git diff --stat || true

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: cargo-${{ runner.os }}-v2-${{ hashFiles('upstream/codex-rs/Cargo.lock', 'upstream/Cargo.lock', 'Kernel/patches/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-v2-

      - name: 编译内核
        run: |
          . "$HOME/.cargo/env"
          cd upstream
          cd "$CODEX_RS_DIR"
          # codex-rs 用 rust-toolchain.toml 锁定 1.95.0，需为该工具链补装 iOS target
          rustup target add aarch64-apple-ios
          rustc --version && rustup target list --installed
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export SDKROOT="$SDK"
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-mios-version-min=15.0 -C link-arg=-isysroot -C link-arg=$SDK -C link-arg=-framework -C link-arg=Security -C link-arg=-framework -C link-arg=CoreFoundation"
          cargo build --profile ${{ github.event.inputs.profile || 'release' }} --target aarch64-apple-ios --bin codex

      - name: strip + ldid 签名
        run: |
          set -e
          BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/release/codex"
          if [ ! -f "$BIN" ]; then BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/debug/codex"; fi
          ls -l "$BIN"
          xcrun --sdk iphoneos strip -x "$BIN" || true
          ldid -SKernel/entitlements-kernel.plist "$BIN" || ldid -S "$BIN"
          ldid -e "$BIN" | head -40 || true
          chmod +x "$BIN"
          file "$BIN"

      - name: 校验 Mach-O
        run: |
          BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/release/codex"
          [ -f "$BIN" ] || BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/debug/codex"
          xcrun --sdk iphoneos otool -hv "$BIN"
          xcrun --sdk iphoneos otool -l "$BIN" | grep -A4 LC_BUILD_VERSION || true

      - name: 收集产物
        run: |
          set -e
          mkdir -p Kernel/dist
          BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/release/codex"
          [ -f "$BIN" ] || BIN="upstream/$CODEX_RS_DIR/target/aarch64-apple-ios/debug/codex"
          cp "$BIN" Kernel/dist/codex
          shasum -a 256 Kernel/dist/codex | tee Kernel/dist/codex.sha256
          ls -l Kernel/dist

      # 失败时把完整编译日志落盘到 dist-kernel-logs 分支，便于无 token 环境排查
      - name: 失败日志落盘
        if: failure()
        run: |
          set -x
          mkdir -p kernel-logs
          . "$HOME/.cargo/env"
          cd upstream
          cd "$CODEX_RS_DIR"
          cargo build --target aarch64-apple-ios --bin codex 2>&1 | tail -n 500 > "$GITHUB_WORKSPACE/kernel-logs/cargo-errors.log" || true
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan kernel-logs-publish
          git reset
          git add -f kernel-logs/
          git commit -m "kernel build failure logs run #${{ github.run_number }}" || exit 0
          git push -f origin kernel-logs-publish:dist-kernel-logs
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-ios-arm64
          path: Kernel/dist/
          retention-days: 30

      # 回传内核到 dist 分支（单提交孤分支）。内核约 236MB，超过 GitHub 100MB 文件上限，
      # 改用 Git LFS 上传；LFS 不可用时降级为仅记录 sha256（产物以 Actions artifact 为准）。
      - name: 回传内核到 dist 分支
        if: always()
        continue-on-error: true
        run: |
          set -x
          [ -f Kernel/dist/codex ] || { echo "没有产物，跳过"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local || true
          git lfs track "Kernel/dist/codex" || true
          git checkout --orphan dist-kernel-publish
          git reset
          git add -f .gitattributes Kernel/dist/
          git commit -m "codex kernel run #${{ github.run_number }} ref=${{ github.event.inputs.codex_ref || 'rust-v0.162.1' }}"
          git push -f origin dist-kernel-publish:dist-kernel
